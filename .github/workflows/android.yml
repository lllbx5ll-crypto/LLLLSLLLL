name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Godot 4.7.2 Android debug build
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      GODOT_VERSION: "4.7.2"
      GODOT_CHANNEL: "stable"
      GODOT_ANDROID_KEYSTORE_DEBUG_USER: "androiddebugkey"
      GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: "android"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK from GitHub runner
        shell: bash
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          "$SDKMANAGER" --version

      - name: Install Android dependencies
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "build-tools;35.0.1" "platforms;android-35"

      - name: Install Godot 4.7.2 and Android export templates
        shell: bash
        run: |
          set -euxo pipefail
          BASE="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-${GODOT_CHANNEL}"
          curl --retry 3 -fL "$BASE/Godot_v${GODOT_VERSION}-${GODOT_CHANNEL}_linux.x86_64.zip" -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot-editor
          sudo install -m 755 "/tmp/godot-editor/Godot_v${GODOT_VERSION}-${GODOT_CHANNEL}_linux.x86_64" /usr/local/bin/godot
          curl --retry 3 -fL "$BASE/Godot_v${GODOT_VERSION}-${GODOT_CHANNEL}_export_templates.tpz" -o /tmp/export_templates.tpz
          mkdir -p /tmp/godot-templates
          unzip -q /tmp/export_templates.tpz -d /tmp/godot-templates
          mkdir -p "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_CHANNEL}"
          cp -r /tmp/godot-templates/templates/. "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_CHANNEL}/"
          godot --version

      - name: Prepare debug keystore
        shell: bash
        run: |
          keytool -genkeypair -v -keystore "$RUNNER_TEMP/alqmishi-debug.keystore" -storepass android -keypass android -alias androiddebugkey -dname "CN=Al-Qmishi, O=Merchants City, C=YE" -keyalg RSA -keysize 2048 -validity 10000 -noprompt
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$RUNNER_TEMP/alqmishi-debug.keystore" >> "$GITHUB_ENV"

      - name: Import project and check scripts
        run: |
          godot --headless --path . --editor --quit
          godot --headless --path . --script tests/smoke_test.gd
          godot --headless --path . --script tests/world_smoke.gd

      - name: Set Godot Android paths
        run: |
          godot --headless --path . --editor --script ci/configure_android.gd

      - name: Export debug APK
        run: |
          mkdir -p build
          godot --headless --path . --export-debug Android build/merchants-city-debug.apk
          test -s build/merchants-city-debug.apk

      - name: Upload playable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Merchants-City-Al-Qmishi-Android-APK
          path: build/merchants-city-debug.apk
          retention-days: 30
          if-no-files-found: error
